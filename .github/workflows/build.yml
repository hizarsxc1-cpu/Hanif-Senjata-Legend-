name: Build H Legendary Weapons

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build mod
        run: gradle build --no-daemon
      - name: Package companion resource pack
        run: |
          mkdir -p build/resourcepack/assets
          cp -r src/main/resources/assets/hlegendary build/resourcepack/assets/
          cp resourcepack/pack.mcmeta build/resourcepack/pack.mcmeta
          cd build/resourcepack
          zip -r ../H-Legendary-ResourcePack.zip .
      - name: Upload mod and resource pack
        uses: actions/upload-artifact@v4
        with:
          name: H-Legendary-Weapons-and-ResourcePack
          path: |
            build/libs/*.jar
            build/H-Legendary-ResourcePack.zip
